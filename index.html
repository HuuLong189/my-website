<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>LONG STORE - Website bán hàng chính thức</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">LONG STORE</div>
  <input id="search" placeholder="Tìm sản phẩm...">
  <div class="cart" onclick="openCart()">🛒 (<span id="cartCount">0</span>)</div>
</header>

<nav>
  <button onclick="filter('all')">Tất cả</button>
  <button onclick="filter('laptop')">Laptop</button>
  <button onclick="filter('pc')">PC</button>
  <button onclick="filter('monitor')">Màn hình</button>
</nav>

<div class="banner" id="banner">🔥 LONG STORE SALE</div>

<div class="products" id="products"></div>

<footer>
  © 2025 LONG STORE - Nguyễn Hữu Long
</footer>

<!-- CART -->
<div id="cartModal" class="modal">
  <div class="modal-content">
    <h3>Giỏ hàng</h3>
    <div id="cartItems"></div>
    <p><b>Tổng:</b> <span id="total"></span></p>
    <button onclick="closeCart()">Đóng</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
