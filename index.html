<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>LONG STORE - Website bán hàng chính thức</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">LONG STORE</div>
  <input id="search" placeholder="Tìm sản phẩm...">
  <div class="cart" onclick="openCart()">🛒 (<span id="cartCount">0</span>)</div>
</header>

<nav>
  <button onclick="filter('all')">Tất cả</button>
  <button onclick="filter('laptop')">Laptop</button>
  <button onclick="filter('pc')">PC</button>
  <button onclick="filter('monitor')">Màn hình</button>
</nav>

<div class="banner" id="banner">🔥 LONG STORE SALE</div>

<div class="products" id="products"></div>

<footer>
  © 2025 LONG STORE - Nguyễn Hữu Long
</footer>

<!-- CART -->
<div id="cartModal" class="modal">
  <div class="modal-content">
    <h3>Giỏ hàng</h3>
    <div id="cartItems"></div>
    <p><b>Tổng:</b> <span id="total"></span></p>
    <button onclick="closeCart()">Đóng</button>
  </div>
</div>

<script src="script.js"></script>
  <!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
  // 🔥 DÁN firebaseConfig CỦA BẠN VÀO ĐÂY
const firebaseConfig = {
  apiKey: "AIzaSyCa2JKz2_B2oFqbIrErJPfrYMNCYbyFFlw",
  authDomain: "long-store-8d819.firebaseapp.com",
  projectId: "long-store-8d819",
  storageBucket: "long-store-8d819.firebasestorage.app",
  messagingSenderId: "225154933198",
  appId: "1:225154933198:web:ca651fa1868fdb85c6cb9f"
};

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const db = firebase.firestore();

  // ====== AUTH ======
  window.register = function () {
    const email = prompt("Nhập email");
    const password = prompt("Nhập mật khẩu");
    auth.createUserWithEmailAndPassword(email, password)
      .then(() => alert("Đăng ký thành công"))
      .catch(err => alert(err.message));
  };

  window.login = function () {
    const email = prompt("Nhập email");
    const password = prompt("Nhập mật khẩu");
    auth.signInWithEmailAndPassword(email, password)
      .then(() => alert("Đăng nhập thành công"))
      .catch(err => alert(err.message));
  };

  // ====== ORDER ======
  window.placeOrder = function () {
    const name = prompt("Tên khách hàng");
    const phone = prompt("Số điện thoại");
    const address = prompt("Địa chỉ");

    db.collection("orders").add({
      name,
      phone,
      address,
      createdAt: new Date()
    }).then(() => {
      alert("Đặt hàng thành công");
    });
  };
</script>

</body>
</html>
